<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Michael's Coloring Club</title>
<style>
  :root {
    --ink: #2b2140;
    --bg1: #ffe9f3;
    --bg2: #e3f4ff;
    --panel: #ffffff;
    --accent: #ff6fb1;
    --accent2: #6c5ce7;
    --gold: #ffc93c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", "Trebuchet MS", sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    overflow: hidden;
    user-select: none;
  }
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; gap: 8px; padding: 8px; }

  /* Header */
  header { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 22px; padding: 8px 14px; box-shadow: 0 4px 0 #0001; }
  .logo { font-size: clamp(18px, 3vw, 28px); font-weight: 900; letter-spacing: .5px; }
  .logo span:nth-child(1){color:#ff5e5e}.logo span:nth-child(2){color:#ff9f1c}.logo span:nth-child(3){color:#2ec4b6}.logo span:nth-child(4){color:#6c5ce7}
  .spacer { flex: 1; }
  .pill { display: flex; align-items: center; gap: 6px; background: #fff6d6; border: 3px solid var(--gold); border-radius: 999px; padding: 4px 12px; font-weight: 900; font-size: 18px; }
  .btn { border: none; cursor: pointer; font-family: inherit; font-weight: 900; font-size: 18px; border-radius: 18px; padding: 10px 14px; background: var(--accent2); color: white; box-shadow: 0 5px 0 #4b3bb3; transition: transform .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #4b3bb3; }
  .btn.pink { background: var(--accent); box-shadow: 0 5px 0 #d14b8f; }
  .btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 #d9a21d; }

  /* Main */
  main { display: grid; grid-template-columns: 110px 1fr 110px; gap: 8px; min-height: 0; }
  .side { background: var(--panel); border-radius: 22px; padding: 10px 8px; display: flex; flex-direction: column; gap: 10px; align-items: center; overflow-y: auto; box-shadow: 0 4px 0 #0001; }
  .side h3 { margin: 0; font-size: 15px; text-align: center; }
  .canvasWrap { position: relative; background: var(--panel); border-radius: 26px; box-shadow: 0 4px 0 #0001; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 10px; }
  #picture { width: 100%; height: 100%; max-height: 100%; }
  #picture .region { cursor: pointer; transition: fill .25s; stroke: #2b2140; stroke-width: 4; stroke-linejoin: round; }
  #picture .region:hover { filter: brightness(.96); }
  #picture .decor { pointer-events: none; }
  .pop { animation: pop .35s ease; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .progress { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #fff; border: 3px solid #eee; border-radius: 999px; width: min(60%, 340px); height: 22px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg,#ff5e5e,#ff9f1c,#ffe66d,#2ec4b6,#6c5ce7); transition: width .3s; }
  .progress-label { position: absolute; top: 38px; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 14px; color: #8a7fa5; }
  .mascot { position: absolute; bottom: 10px; left: 14px; font-size: 44px; animation: bob 2s infinite ease-in-out; }
  .bubble { position: absolute; bottom: 62px; left: 14px; background: #fff; border: 3px solid var(--accent2); border-radius: 18px; padding: 6px 12px; font-weight: 900; max-width: 260px; font-size: 16px; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* Tools */
  .tool { width: 84px; height: 72px; border-radius: 18px; border: 4px solid transparent; background: #f3efff; cursor: pointer; font-family: inherit; font-weight: 900; font-size: 13px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tool .ic { font-size: 28px; }
  .tool.active { border-color: var(--accent2); background: #e4dcff; transform: scale(1.05); }
  .tool:active { transform: scale(.95); }

  /* Pictures */
  .thumb { width: 84px; height: 84px; border-radius: 18px; border: 4px solid #eee; background: #fff; cursor: pointer; padding: 4px; position: relative; }
  .thumb.active { border-color: var(--accent); }
  .thumb svg { width: 100%; height: 100%; }
  .thumb .done { position: absolute; top: -8px; right: -8px; font-size: 22px; }

  /* Palette */
  footer { background: var(--panel); border-radius: 22px; padding: 10px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 #0001; }
  .current { width: 70px; height: 70px; border-radius: 50%; border: 5px solid var(--ink); flex: none; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: inset 0 -6px 0 #0002; }
  .palette { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; justify-content: center; }
  .swatch { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 3px #ddd, inset 0 -6px 0 #0002; cursor: pointer; transition: transform .12s; position: relative; }
  .swatch:hover { transform: scale(1.1); }
  .swatch.active { transform: scale(1.22); box-shadow: 0 0 0 4px var(--ink), inset 0 -6px 0 #0002; z-index: 1; }
  .swatch .key { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #a59cbc; font-weight: 900; }
  .swatch.rainbow { background: conic-gradient(#ff5e5e,#ff9f1c,#ffe66d,#2ec4b6,#4d96ff,#a66cff,#ff5e5e); }

  /* Modal */
  .modal { position: fixed; inset: 0; background: #2b214099; display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .card { background: #fff; border-radius: 30px; padding: 22px; width: min(92vw, 720px); max-height: 88vh; overflow-y: auto; text-align: center; box-shadow: 0 10px 0 #0003; animation: drop .4s ease; }
  @keyframes drop { from { transform: translateY(-40px) scale(.9); opacity: 0 } to { transform: none; opacity: 1 } }
  .card h2 { margin: 0 0 8px; font-size: 30px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin: 14px 0; }
  .badge { border-radius: 22px; padding: 12px 8px; background: #f4f4f4; filter: grayscale(1); opacity: .55; }
  .badge.earned { background: linear-gradient(160deg,#fff6d6,#ffe1f0); filter: none; opacity: 1; border: 3px solid var(--gold); }
  .badge .medal { font-size: 46px; }
  .badge .name { font-weight: 900; font-size: 15px; }
  .badge .desc { font-size: 12px; color: #7a7090; }
  .bigBadge { font-size: 110px; animation: spin 1s ease; display: inline-block; }
  @keyframes spin { from { transform: rotate(-200deg) scale(0) } to { transform: none } }

  .toast { position: fixed; top: 16px; right: 16px; background: #fff; border: 4px solid var(--gold); border-radius: 20px; padding: 10px 16px; font-weight: 900; z-index: 60; display: flex; gap: 10px; align-items: center; transform: translateX(140%); transition: transform .35s; }
  .toast.show { transform: none; }
  .toast .medal { font-size: 36px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .side { flex-direction: row; overflow-x: auto; padding: 6px; }
    .side h3 { display: none; }
    .tool, .thumb { width: 64px; height: 60px; flex: none; }
    .swatch { width: 40px; height: 40px; }
    .current { width: 50px; height: 50px; }
  }
</style>
</head>

  tool: 'fill',
  picIndex: saved.picIndex || 0,
  fills: saved.fills || {},          // { picId: { regionId: color } }
  badges: saved.badges || {},        // { badgeId: true }
  stars: saved.stars || 0,
  totalFills: saved.totalFills || 0,
  colorsTried: saved.colorsTried || {},
  completed: saved.completed || {},  // { picId: true }
  sound: saved.sound !== false,
  history: [],
  rainbowStep: 0,
  picStart: Date.now(),
};
function save() {
  const { color, tool, history, rainbowStep, picStart, ...persist } = state;
  localStorage.setItem(STORE_KEY, JSON.stringify(persist));
}

// ---------- Sound ----------
let audio;
function beep(freqs, dur = 0.12, type = 'triangle') {
  if (!state.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = f;
      const t = audio.currentTime + i * dur;
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.4);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur * 1.5);
    });
  } catch (e) {}
}
const sfx = {
  pick: () => beep([660], .08, 'sine'),
  fill: () => beep([523 + Math.random() * 200, 784], .07),
  erase: () => beep([300, 200], .08, 'square'),
  badge: () => beep([523, 659, 784, 1046], .12),
  win: () => beep([523, 659, 784, 1046, 784, 1046, 1318], .13),
};

// ---------- Elements ----------
const $ = (s) => document.querySelector(s);
const svg = $('#picture');

// ---------- Palette ----------
function buildPalette() {
  const pal = $('#palette');
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c.hex;
    b.title = c.name;
    b.setAttribute('aria-label', c.name);
    b.dataset.hex = c.hex;
    if (i < 9) b.innerHTML = `<span class="key">${i + 1}</span>`;
    b.onclick = () => selectColor(c.hex, c.name);
    pal.appendChild(b);
  });
  updateCurrent();
}
function selectColor(hex, name) {
  state.color = hex;
  if (state.tool !== 'fill') setTool('fill');
  sfx.pick();
  say(`${name}! Now tap a spot.`);
  updateCurrent();
}
function updateCurrent() {
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.hex === state.color && state.tool === 'fill'));
  const cur = $('#current');
  if (state.tool === 'eraser') { cur.style.background = '#fff'; cur.textContent = '??'; }
  else if (state.tool === 'rainbow') { cur.style.background = 'conic-gradient(#ff5e5e,#ff9f1c,#ffe66d,#2ec4b6,#4d96ff,#a66cff,#ff5e5e)'; cur.textContent = '??'; }
  else { cur.style.background = state.color; cur.textContent = ''; }
}

// ---------- Tools ----------
function setTool(t) {
  state.tool = t;
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  updateCurrent();
  if (t === 'eraser') say('Eraser time! Tap a spot to clean it.');
  if (t === 'rainbow') { say('Rainbow brush! Every tap is a new color!'); award('rainbowBrush'); }
}
document.querySelectorAll('.tool[data-tool]').forEach(b => b.onclick = () => { sfx.pick(); setTool(b.dataset.tool); });

$('#undoBtn').onclick = () => {
  const last = state.history.pop();
  if (!last) { say('Nothing to undo!'); return; }
  const pic = PICTURES[state.picIndex];
  const map = state.fills[pic.id] || {};
  if (last.prev) map[last.region] = last.prev; else delete map[last.region];
  state.fills[pic.id] = map;
  paintRegion(last.region, last.prev);
  sfx.erase(); award('oopsFixer'); say('Undone!');
  updateProgress(); save();
};
$('#clearBtn').onclick = () => {
  const pic = PICTURES[state.picIndex];
  if (!Object.keys(state.fills[pic.id] || {}).length) return;
  if (!confirm('Start this picture over?')) return;
  state.fills[pic.id] = {}; state.history = []; state.picStart = Date.now();
  renderPicture(); save(); say('Fresh page! Let\u2019s go!');
};
$('#magicBtn').onclick = () => {
  // Sparkle hint: wiggle an empty spot
  const pic = PICTURES[state.picIndex];
  const map = state.fills[pic.id] || {};
  const empty = [...svg.querySelectorAll('.region')].filter(r => !map[r.dataset.r]);
  if (!empty.length) { say('Everything is colored! ?'); return; }
  const r = empty[Math.floor(Math.random() * empty.length)];
  const prevStroke = r.style.stroke;
  let n = 0;
  const iv = setInterval(() => {
    r.style.stroke = n % 2 ? '#2b2140' : '#ffc93c';
    r.style.strokeWidth = n % 2 ? '' : '9';
    if (++n > 7) { clearInterval(iv); r.style.stroke = prevStroke; r.style.strokeWidth = ''; }
  }, 180);
  beep([880, 1175, 1568], .08, 'sine');
  say(`Psst! ${empty.length} spot${empty.length > 1 ? 's' : ''} left. Try the sparkly one!`);
};

// ---------- Pictures ----------
function buildPictureList() {
  const list = $('#pictureList');
  list.querySelectorAll('.thumb').forEach(t => t.remove());
  PICTURES.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'thumb' + (i === state.picIndex ? ' active' : '');
    b.title = p.name;
    b.innerHTML = `<svg viewBox="0 0 400 400">${p.svg}</svg>${state.completed[p.id] ? '<span class="done">?</span>' : ''}`;
    const map = state.fills[p.id] || {};
    b.querySelectorAll('.region').forEach(r => {
      r.setAttribute('fill', map[r.dataset.r] || '#fff');
      r.setAttribute('stroke', '#2b2140'); r.setAttribute('stroke-width', '6');
    });
    b.onclick = () => { state.picIndex = i; state.history = []; state.picStart = Date.now(); renderPicture(); buildPictureList(); save(); sfx.pick(); say(`Let\u2019s color the ${p.name}! ${p.emoji}`); };
    list.appendChild(b);
  });
}
function renderPicture() {
  const pic = PICTURES[state.picIndex];
  svg.innerHTML = pic.svg;
  const map = state.fills[pic.id] || {};
  svg.querySelectorAll('.region').forEach(r => {
    r.setAttribute('fill', map[r.dataset.r] || '#ffffff');
    r.addEventListener('pointerdown', (e) => { e.preventDefault(); onRegionTap(r); });
  });
  updateProgress();
}
function paintRegion(id, color) {
  const el = svg.querySelector(`.region[data-r="${id}"]`);
  if (!el) return;
  el.setAttribute('fill', color || '#ffffff');
  el.classList.remove('pop'); void el.getBoundingClientRect(); el.classList.add('pop');
}
function onRegionTap(el) {
  const pic = PICTURES[state.picIndex];
  const id = el.dataset.r;
  const map = state.fills[pic.id] = state.fills[pic.id] || {};
  const prev = map[id];
  let color;
  if (state.tool === 'eraser') {
    if (!prev) return;
    delete map[id]; paintRegion(id, null); sfx.erase(); award('oopsFixer');
  } else {
    color = state.tool === 'rainbow' ? RAINBOW[state.rainbowStep++ % RAINBOW.length] : state.color;
    if (prev === color) return;
    map[id] = color; paintRegion(id, color); sfx.fill();
    if (!prev) { state.stars++; }
    state.totalFills++;
    state.colorsTried[color] = true;
    sparkleAt(el);
    if (Math.random() < .35) say(CHEERS[Math.floor(Math.random() * CHEERS.length)]);
  }
  state.history.push({ region: id, prev });
  if (state.history.length > 100) state.history.shift();
  checkBadges();
  updateProgress();
  save();
}
function updateProgress() {
  const pic = PICTURES[state.picIndex];
  const total = svg.querySelectorAll('.region').length;
  const done = Object.keys(state.fills[pic.id] || {}).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $('#progressBar').style.width = pct + '%';
  $('#progressLabel').textContent = `${pic.emoji} ${pic.name}: ${done}/${total} spots`;
  $('#stars').textContent = state.stars;
  if (done === total && !state.completed[pic.id] && total > 0) completePicture(pic);
}
function completePicture(pic) {
  state.completed[pic.id] = true;
  state.stars += 10;
  const secs = (Date.now() - state.picStart) / 1000;
  award('finisher');
  award(pic.id);
  if (secs < 90) award('speedy');
  if (Object.keys(state.completed).length >= 3) award('collector');
  if (PICTURES.every(p => state.completed[p.id])) award('champion');
  save(); buildPictureList();
  setTimeout(() => {
    sfx.win(); confetti(220);
    const b = BADGES.find(b => b.id === pic.id);
    $('#winIcon').textContent = b.icon;
    $('#winTitle').textContent = `${b.name} Badge!`;
    $('#winText').textContent = `You finished the ${pic.name}! +10 ?`;
    $('#winModal').classList.add('show');
  }, 450);
}
$('#nextPicBtn').onclick = () => {
  $('#winModal').classList.remove('show');
  const next = PICTURES.findIndex(p => !state.completed[p.id]);
  state.picIndex = next >= 0 ? next : (state.picIndex + 1) % PICTURES.length;
  state.history = []; state.picStart = Date.now();
  renderPicture(); buildPictureList(); save();
  say(`New picture: ${PICTURES[state.picIndex].name}! ${PICTURES[state.picIndex].emoji}`);
};

// ---------- Badges ----------
function checkBadges() {
  if (state.totalFills >= 1) award('firstSplash');
  if (state.totalFills >= 25) award('paintParty');
  if (state.totalFills >= 100) award('colorWizard');
  const pic = PICTURES[state.picIndex];
  const used = new Set(Object.values(state.fills[pic.id] || {}));
  if (used.size >= 6) award('rainbowMaker');
  if (COLORS.every(c => state.colorsTried[c.hex])) award('explorer');
}
const toastQueue = [];
let toastBusy = false;
function award(id) {
  if (state.badges[id]) return;
  state.badges[id] = true;
  state.stars += 5;
  save(); updateBadgeCount();
  const b = BADGES.find(b => b.id === id);
  toastQueue.push(b); runToasts();
}
function runToasts() {
  if (toastBusy || !toastQueue.length) return;
  toastBusy = true;
  const b = toastQueue.shift();
  $('#toastIcon').textContent = b.icon;
  $('#toastText').textContent = b.name + '  +5 ?';
  $('#toast').classList.add('show');
  sfx.badge(); confetti(60);
  $('#stars').textContent = state.stars;
  setTimeout(() => { $('#toast').classList.remove('show'); setTimeout(() => { toastBusy = false; runToasts(); }, 400); }, 2200);
}
function updateBadgeCount() {
  $('#badgeCount').textContent = Object.keys(state.badges).length;
  $('#badgeTotal').textContent = BADGES.length;
}
function renderBadgeShelf() {
  const grid = $('#badgeGrid');
  grid.innerHTML = BADGES.map(b => `
    <div class="badge ${state.badges[b.id] ? 'earned' : ''}">
      <div class="medal">${state.badges[b.id] ? b.icon : '??'}</div>
      <div class="name">${b.name}</div>
      <div class="desc">${b.desc}</div>
    </div>`).join('');
  const n = Object.keys(state.badges).length;
  $('#badgeSummary').innerHTML = `<b style="font-size:18px">${n} of ${BADGES.length} badges ? ${state.stars} ?</b>`;
}
$('#openBadges').onclick = () => { renderBadgeShelf(); $('#badgeModal').classList.add('show'); sfx.pick(); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('show'));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

// ---------- Mascot ----------
let sayTimer;
function say(text) {
  const b = $('#bubble');
  b.textContent = text; b.style.display = 'block';
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => b.style.display = 'none', 3200);
}

// ---------- Confetti & sparkles ----------
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [];
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();
function confetti(n, x = innerWidth / 2, y = innerHeight / 3) {
  for (let i = 0; i < n; i++) parts.push({
    x, y, vx: (Math.random() - .5) * 16, vy: Math.random() * -14 - 2,
    c: RAINBOW[i % RAINBOW.length], s: 6 + Math.random() * 8, r: Math.random() * 6, life: 120,
  });
}
function sparkleAt(el) {
  const b = el.getBoundingClientRect();
  const x = b.left + b.width / 2, y = b.top + b.height / 2;
  for (let i = 0; i < 14; i++) parts.push({
    x, y, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8,
    c: state.tool === 'rainbow' ? RAINBOW[i % RAINBOW.length] : state.color, s: 5 + Math.random() * 5, r: 0, life: 40, star: true,
  });
}
(function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life-- > 0);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.star ? .1 : .35; p.r += .1;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
    cx.globalAlpha = Math.min(1, p.life / 30);
    cx.fillStyle = p.c; cx.strokeStyle = '#2b214055';
    if (p.star) { cx.beginPath(); for (let k = 0; k < 5; k++) { cx.lineTo(Math.cos((18 + k * 72) * Math.PI / 180) * p.s, -Math.sin((18 + k * 72) * Math.PI / 180) * p.s); cx.lineTo(Math.cos((54 + k * 72) * Math.PI / 180) * p.s / 2, -Math.sin((54 + k * 72) * Math.PI / 180) * p.s / 2); } cx.closePath(); cx.fill(); cx.stroke(); }
    else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    cx.restore();
  });
  requestAnimationFrame(loop);
})();

// ---------- Keyboard ----------
addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9) { const c = COLORS[n - 1]; selectColor(c.hex, c.name); }
  if (e.key === 'e') setTool('eraser');
  if (e.key === 'r') setTool('rainbow');
  if (e.key === 'f') setTool('fill');
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') $('#undoBtn').click();
});

// ---------- Sound toggle ----------
function updateSoundBtn() { $('#soundBtn').textContent = state.sound ? '??' : '??'; }
$('#soundBtn').onclick = () => { state.sound = !state.sound; updateSoundBtn(); save(); sfx.pick(); };

// ---------- Init ----------
buildPalette();
buildPictureList();
renderPicture();
updateBadgeCount();
updateSoundBtn();
say('Hi! I\u2019m Sparkle ?? Pick a color, then tap the picture!');
</script>
</body>
</html>
